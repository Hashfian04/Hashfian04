<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <!-- Filter Glow Neon -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: #0d0221; }
    .grid { stroke: #261447; stroke-width: 1; stroke-dasharray: 5 5; }
    .center-line { stroke: #ff007f; stroke-width: 3; stroke-dasharray: 10 10; opacity: 0.6; }
    
    /* Neon Text */
    .retro-title {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 28px;
      fill: #00f6ff;
      filter: url(#neon-cyan);
    }

    /* Animation Paddle Left */
    @keyframes movePaddleLeft {
      0%, 100% { y: 80px; }
      50% { y: 130px; }
    }
    .paddle-left {
      fill: #00f6ff;
      filter: url(#neon-cyan);
      animation: movePaddleLeft 4s ease-in-out infinite;
    }

    /* Animation Paddle Right */
    @keyframes movePaddleRight {
      0%, 100% { y: 120px; }
      50% { y: 60px; }
    }
    .paddle-right {
      fill: #ff007f;
      filter: url(#neon-pink);
      animation: movePaddleRight 4s ease-in-out infinite;
    }

    /* Animation Ball */
    @keyframes moveBall {
      0% { cx: 50px; cy: 100px; }
      25% { cx: 400px; cy: 180px; }
      50% { cx: 750px; cy: 90px; }
      75% { cx: 400px; cy: 40px; }
      100% { cx: 50px; cy: 100px; }
    }
    .ball {
      fill: #ffe600;
      filter: url(#neon-cyan);
      animation: moveBall 4s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="800" height="250" rx="12" />
  
  <!-- Line Tengah Arcade -->
  <line x1="400" y1="0" x2="400" y2="250" class="center-line" />

  <!-- Skor Retro -->
  <text x="330" y="50" class="retro-title">08</text>
  <text x="440" y="50" class="retro-title" style="fill: #ff007f;">99</text>

  <!-- Paddles & Ball -->
  <rect x="30" y="80" width="12" height="60" rx="4" class="paddle-left" />
  <rect x="758" y="120" width="12" height="60" rx="4" class="paddle-right" />
  <circle cx="50" cy="100" r="8" class="ball" />
</svg>
